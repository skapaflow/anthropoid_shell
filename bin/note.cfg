# note.cfg - settings and colors of note
#
# note reads this file from the folder of note.exe. Anything missing here keeps
# its default (the defaults are this same Monokai theme). A bad line shows up in
# the status bar when note starts.
#
# Colors:  key = #RRGGBB [on #RRGGBB] [bold] [italic] [underline]
#          "none" leaves a color unset (it comes from the text style).

[editor]
tab_size       = 4
expand_tabs    = false
word_wrap      = false
line_numbers   = true
syntax         = true
auto_indent    = true
highlight_line = true
mouse          = true

[colors]
# text area
text                = #F8F8F2 on #272822
current_line        = none on #3E3D32
selection           = none on #49483E
bracket             = #F8F8F2 on #75715E bold
line_number         = #90908A
line_number_current = #F8F8F2
control             = #F8F8F0 on #F92672

# syntax
comment             = #75715E
keyword             = #F92672
type                = #66D9EF italic
function            = #A6E22E
string              = #E6DB74
number              = #AE81FF
constant            = #AE81FF
preprocessor        = #F92672
operator            = #F92672

# menu bar and menus
menu_bar            = #F8F8F2 on #1E1F1C
menu_hotkey         = #FD971F
menu                = #F8F8F2 on #3E3D32
menu_selected       = #272822 on #A6E22E
menu_shortcut       = #90908A

# status bar
status_bar          = #F8F8F2 on #1E1F1C
status_message      = #E6DB74
status_error        = #F92672 bold

# dialogs
dialog              = #F8F8F2 on #3E3D32
dialog_title        = #E6DB74 bold
button              = #F8F8F2 on #49483E
button_selected     = #272822 on #A6E22E
button_hotkey       = #FD971F
field               = #F8F8F2 on #272822
shadow              = none on #141411
